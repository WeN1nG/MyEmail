name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 版本写死，不用 `@stable`：stable 漂移会让「本地全绿、CI 突然红」。
      # 2026-11-17 就踩过——CI 解析到 1.100.0，新 `clippy::needless_range_loop`
      # 判了 `for i in 0..n { v[i] }`，而本机 stable 卡在 1.99.1（镜像未同步），
      # 本地根本复现不出来（连 `rustup toolchain install 1.100.0` 都是 404）。
      # 升级步骤：`rustup update stable` → 本地跑一遍三道门禁 → 改这里的版本号。
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: cargo-deny
        # 版本写死，同上：cargo-deny 每次发新版都可能带来新的 lint 或配置字段，
        # 而本机装的是 0.20.2，CI 若取最新版就会出现「本地全绿、CI 突然红」，
        # 且**本地根本复现不出来**——deny.toml 里若用了新版才有的字段，
        # 0.20.2 会报 unexpected-keys，反之亦然。
        # 2026-11-18 实测：0.21.0 的 [advisories] 新增 ignore-expiry / ignore.allow，
        # 0.20.2 不认，所以版本必须两边一致。
        # 升级步骤：cargo install cargo-deny --version <新版本> --locked --root <临时目录>
        # → 用该版本跑一遍 cargo deny check → 改这里的版本号。
        run: |
          cargo install cargo-deny --version 0.21.0 --locked
          cargo deny check