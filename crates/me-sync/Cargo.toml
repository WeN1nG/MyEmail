[package]
name = "me-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MyEmail sync orchestration, background indexing and task governance"

[dependencies]
me-core = { workspace = true }
me-proto = { workspace = true }
me-store = { workspace = true }
keyring = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }

[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"