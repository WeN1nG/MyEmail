[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Only fail on unmaintained crates that are direct workspace dependencies.
# Transitive Linux D-Bus/font crates are tracked upstream.
unmaintained = "workspace"
# `libsqlite3-sys` 必须 >= 0.39（打包 SQLite >= 3.54.0）：
# RUSTSEC-2026-0459 / CVE-2026-119375，旧版打开「页大小与库不一致的 -wal」时
# 可能把进程内存里的旧字节当查询结果返回。
# 因此 `r2d2_sqlite` 已被移除——它把 rusqlite 钉死在 ^0.40，会让
# libsqlite3-sys 0.38 一直被拖进依赖树；连接工厂改为 `me-store/src/db.rs`
# 里自实现的 `SqliteConnectionManager`（语义与原来完全一致）。
# 升级 rusqlite 时先跑：cargo tree -i libsqlite3-sys，确认只剩一个 0.39+。
#
# **显式豁免**（不是关掉检查）：这两条是 `unmaintained` 类的 informational
# advisory——上游 chronotope 宣布停止维护，**没有可用的修复版本**
# （advisory 原文 "all versions are affected"），官方只推荐迁移到 jiff / time。
# 它们**不是安全漏洞**，没有 CVE，也不影响构建与运行。
#
#   RUSTSEC-2026-0543  chrono      （2026-11-17 进 rustsec-db，故 CI 当天才红）
#   RUSTSEC-2026-0555  chrono-tz
#
# 为什么不立刻迁移：`chrono` 在本项目里承载了日历重复规则展开与 DST 歧义处理
# （`LocalResult::Ambiguous` / `None` 的择一策略，见 me-app/src/views/calendar.rs），
# `time` / `jiff` 在这几点上的语义与 chrono 不同，贸然迁移会让**日程时间偏移**——
# 那是个静默的、用户很难察觉的正确性 bug，比「上游停维护」严重得多。
# 迁移应当作为独立一轮改动做（配套日历回归测试），不能夹在 CI 抢修里。
#
# 注意：豁免的是**这两条具体的 advisory**，不是整个 crate——
# `chrono` 将来若出现真正的安全 advisory，cargo-deny 仍会照报。
ignore = [
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
# Internal workspace/path dependencies are intentionally versionless.
# Registry dependencies are still pinned by Cargo.lock.
wildcards = "allow"
deny = [
    # Protocol stack uses rustls only; OpenSSL / native-tls are forbidden.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]